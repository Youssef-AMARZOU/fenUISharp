name: Release - Easy Download for Noobs

on:
  workflow_dispatch:
  push:
    tags: [ "v*" ]

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build fenUI
        run: dotnet build fenUI.sln -c Release
      - name: Pack NuGet (for GitHub Packages)
        run: dotnet pack fenUI/fenUI.csproj -c Release -o ./nupkg
      - name: Publish to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet nuget push ./nupkg/*.nupkg --source https://nuget.pkg.github.com/Youssef-AMARZOU/index.json --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
      - name: Create Portable Zip
        run: |
          mkdir dist
          copy fenUI\bin\Release\net9.0-windows10.0.19041.0\fenUI.dll dist\
          Compress-Archive -Path dist\* -DestinationPath DynamicISLAND_windows-Portable.zip
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: DynamicISLAND_windows-Portable.zip
          generate_release_notes: true
